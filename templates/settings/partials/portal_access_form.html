<form class="appointment-form" method="post" action="{% if object %}{% url action_url object.pk %}{% else %}{% url action_url %}{% endif %}" {% if not object %}data-portal-access-form{% endif %}>
  {% csrf_token %}
  <div class="field-grid two">
    <div class="field"><label>Client</label><select name="client" required {% if object %}disabled{% endif %}>{% if object %}{% for client in portal_clients %}<option value="{{ client.pk }}" {% if object.client_id == client.pk %}selected{% endif %}>{{ client }}</option>{% endfor %}{% else %}{% for suggestion in portal_client_suggestions %}<option value="{{ suggestion.client.pk }}" data-email="{{ suggestion.email }}" data-username="{{ suggestion.username }}">{{ suggestion.client }}</option>{% endfor %}{% endif %}</select>{% if object %}<input type="hidden" name="client" value="{{ object.client_id }}">{% endif %}</div>
    <div class="field"><label>Username</label><input name="username" value="{{ object.user.username }}" required></div>
    <div class="field"><label>Email</label><input name="email" type="email" value="{{ object.user.email }}" required></div>

    <div class="field checkbox-field"><label><input name="is_active" type="checkbox" {% if object.is_active or not object %}checked{% endif %}> Active portal access</label></div>
  </div>
  {% if not object %}<p>We’ll send a one-time link to this email address so they can set their own password.</p>{% endif %}
  <div class="form-actions"><button class="btn btn-secondary" type="button" data-modal-close>Cancel</button><button class="btn btn-primary" type="submit">{{ submit_label }}</button></div>
</form>
