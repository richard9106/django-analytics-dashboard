<div class="field"><label for="insurance-type-{{ uid }}">Billing type</label><select id="insurance-type-{{ uid }}" name="billing_type"><option value="self_pay">Self-pay</option><option value="insurance" {% if insurance_client.billing_type == 'insurance' %}selected{% endif %}>Insurance</option></select></div>
<div class="field"><label for="insurance-payer-{{ uid }}">Insurance payer</label><select id="insurance-payer-{{ uid }}" name="insurance_payer"><option value="">Not linked</option>{% if insurance_client.insurance_payer_id %}<option value="{{ insurance_client.insurance_payer_id }}" selected>{{ insurance_client.insurance_payer.name }} (current)</option>{% endif %}{% for payer in insurance_payers %}{% if payer.pk != insurance_client.insurance_payer_id %}<option value="{{ payer.pk }}">{{ payer.name }}</option>{% endif %}{% endfor %}</select><small>Enable additional payers in Insurance settings. Existing disabled assignments are retained.</small></div>
<div class="field"><label for="insurance-state-{{ uid }}">Insurance rate state</label><input id="insurance-state-{{ uid }}" name="insurance_state" maxlength="2" placeholder="CA" value="{{ insurance_client.insurance_state }}"></div>
<div class="field"><label for="insurance-share-{{ uid }}">Expected client share per session (USD)</label><input id="insurance-share-{{ uid }}" name="insurance_copay" type="number" min="0" step="0.01" value="{{ insurance_client.insurance_copay|default_if_none:'' }}"><small>Reference only; confirm responsibility for each invoice.</small></div>
<div class="field"><label for="insurance-legacy-{{ uid }}">Legacy / reference insurance name</label><input id="insurance-legacy-{{ uid }}" name="insurance_provider" value="{{ insurance_client.insurance_provider }}"><small>Existing text is retained. Select a payer above to link the record.</small></div>
