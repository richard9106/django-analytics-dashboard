<dialog class="modal-dialog" id="client-edit-modal">
  <div class="modal-card">
    <div class="modal-head"><div><p class="eyebrow">Edit Client</p><h2>{{ client }}</h2></div><button class="modal-close" type="button" data-modal-close aria-label="Close">×</button></div>
    <form class="appointment-form" method="post" enctype="multipart/form-data" action="{% url 'clients:edit' client.pk %}">
      {% csrf_token %}
      <div class="field-grid two">
        <div class="field"><label for="workspace-client-first-name">First name</label><input id="workspace-client-first-name" name="first_name" value="{{ client.first_name }}" required></div>
        <div class="field"><label for="workspace-client-last-name">Last name</label><input id="workspace-client-last-name" name="last_name" value="{{ client.last_name }}" required></div>
        <div class="field"><label for="workspace-client-photo">Profile photo</label><input id="workspace-client-photo" name="profile_photo" type="file" accept="image/*"></div>
        <div class="field"><label for="workspace-client-email">Email</label><input id="workspace-client-email" name="email" type="email" value="{{ client.email }}"></div>
        <div class="field"><label for="workspace-client-phone">Phone</label><input id="workspace-client-phone" name="phone" value="{{ client.phone }}"></div>
        <div class="field"><label for="workspace-client-dob">Date of birth</label><input id="workspace-client-dob" name="date_of_birth" type="date" value="{{ client.date_of_birth|date:'Y-m-d' }}"></div>
        <div class="field"><label for="workspace-client-status">Status</label><select id="workspace-client-status" name="status" required><option value="active" {% if client.status == 'active' %}selected{% endif %}>Active</option><option value="inactive" {% if client.status == 'inactive' %}selected{% endif %}>Inactive</option><option value="archived" {% if client.status == 'archived' %}selected{% endif %}>Archive</option></select></div>
        <div class="field"><label for="workspace-client-therapist">Primary therapist</label><select id="workspace-client-therapist" name="primary_therapist"><option value="">Unassigned</option>{% for therapist in client_therapists %}<option value="{{ therapist.pk }}" {% if client.primary_therapist_id == therapist.pk %}selected{% endif %}>{{ therapist }}</option>{% endfor %}</select></div>
        <div class="field"><label for="workspace-client-insurance">Insurance provider</label><input id="workspace-client-insurance" name="insurance_provider" value="{{ client.insurance_provider }}"></div>
        <div class="field"><label for="workspace-client-member">Insurance member ID</label><input id="workspace-client-member" name="insurance_member_id" value="{{ client.insurance_member_id }}"></div>
        <div class="field"><label for="workspace-client-emergency-name">Emergency contact name</label><input id="workspace-client-emergency-name" name="emergency_contact_name" value="{{ client.emergency_contact_name }}"></div>
        <div class="field"><label for="workspace-client-emergency-phone">Emergency contact phone</label><input id="workspace-client-emergency-phone" name="emergency_contact_phone" value="{{ client.emergency_contact_phone }}"></div>
        <div class="field full"><label for="workspace-client-address-1">Address line 1</label><input id="workspace-client-address-1" name="address_line1" value="{{ client.address_line1 }}"></div>
        <div class="field full"><label for="workspace-client-address-2">Address line 2</label><input id="workspace-client-address-2" name="address_line2" value="{{ client.address_line2 }}"></div>
      </div>
      <div class="form-actions split-actions"><button class="btn btn-danger" type="submit" formaction="{% url 'clients:delete' client.pk %}" data-confirm-message="Delete this client and their associated workspace data? This cannot be undone.">Delete client</button><div class="form-actions"><button class="btn btn-secondary" type="button" data-modal-close>Cancel</button><button class="btn btn-primary" type="submit">Save changes</button></div></div>
    </form>
  </div>
</dialog>
