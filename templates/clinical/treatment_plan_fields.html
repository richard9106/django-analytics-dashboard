<div class="field-grid two">
  <div class="field"><label for="plan-client-{{ prefix }}">Client</label><select id="plan-client-{{ prefix }}" name="client" required>{% for client in plan_clients %}<option value="{{ client.pk }}" {% if plan.client_id == client.pk %}selected{% endif %}>{{ client }}</option>{% endfor %}</select></div>
  <div class="field"><label for="plan-therapist-{{ prefix }}">Therapist</label><select id="plan-therapist-{{ prefix }}" name="therapist" required>{% for therapist in plan_therapists %}<option value="{{ therapist.pk }}" {% if plan.therapist_id == therapist.pk %}selected{% endif %}>{{ therapist }}</option>{% endfor %}</select></div>
  <div class="field"><label for="plan-title-{{ prefix }}">Title</label><input id="plan-title-{{ prefix }}" name="title" value="{{ plan.title }}" required></div>
  <div class="field"><label for="plan-status-{{ prefix }}">Status</label><select id="plan-status-{{ prefix }}" name="status" required><option value="active" {% if plan.status == 'active' %}selected{% endif %}>Active</option><option value="review_due" {% if plan.status == 'review_due' %}selected{% endif %}>Review Due</option><option value="completed" {% if plan.status == 'completed' %}selected{% endif %}>Completed</option><option value="discontinued" {% if plan.status == 'discontinued' %}selected{% endif %}>Discontinued</option></select></div>
  <div class="field"><label for="plan-start-{{ prefix }}">Start date</label><input id="plan-start-{{ prefix }}" name="start_date" type="date" value="{% if plan %}{{ plan.start_date|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}" required></div>
  <div class="field"><label for="plan-review-{{ prefix }}">Review date</label><input id="plan-review-{{ prefix }}" name="review_date" type="date" value="{{ plan.review_date|date:'Y-m-d' }}"></div>
  <div class="field"><label for="plan-completed-{{ prefix }}">Completed date</label><input id="plan-completed-{{ prefix }}" name="completed_at" type="date" value="{{ plan.completed_at|date:'Y-m-d' }}"></div>
  <div class="field full" data-diagnosis-picker data-options-url="{% url 'clinical:diagnosis_options' 0 %}"><label>Patient diagnoses</label><div data-diagnosis-choices>{% if plan %}{% for diagnosis in plan.diagnoses.all %}<label class="checkbox-option"><input name="diagnoses" type="checkbox" value="{{ diagnosis.pk }}" checked> {{ diagnosis.code }} · {{ diagnosis.label }}</label>{% endfor %}{% endif %}</div><p data-diagnosis-status role="status">Choose a patient to select their diagnoses. Manage diagnoses in the patient record.</p><button class="inline-link" type="button" data-diagnosis-reload>Reload diagnoses</button></div>
  <div class="field full"><label for="plan-goals-{{ prefix }}">Goals</label><textarea id="plan-goals-{{ prefix }}" name="goals" rows="5" required>{{ plan.goals }}</textarea></div>
  <div class="field full"><label for="plan-objectives-{{ prefix }}">Objectives</label><textarea id="plan-objectives-{{ prefix }}" name="objectives" rows="4">{{ plan.objectives }}</textarea></div>
  <div class="field full"><label for="plan-interventions-{{ prefix }}">Interventions</label><textarea id="plan-interventions-{{ prefix }}" name="interventions" rows="4">{{ plan.interventions }}</textarea></div>
</div>
