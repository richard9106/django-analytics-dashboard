{% load workspace_navigation %}
{% workspace_breadcrumb_items as breadcrumbs %}
{% if breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% for crumb in breadcrumbs %}
    <li>
      {% if not forloop.first %}<span class="breadcrumb-separator" aria-hidden="true">›</span>{% endif %}
      {% if crumb.url %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}<span{% if forloop.last %} aria-current="page"{% endif %}>{{ crumb.label }}</span>{% endif %}
    </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
