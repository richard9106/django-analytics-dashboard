<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Package Usage | NuviaMy</title><link rel="stylesheet" href="/static/dashboard.css"></head><body class="app-page"><main class="app-main"><section class="panel form-panel"><div class="panel-head"><div><h2>Use package session</h2><p>Apply one or more prepaid sessions to an appointment.</p></div></div><form class="appointment-form" method="post">{% csrf_token %}<div class="field-grid two">{% for field in form %}<div class="field {% if field.name == 'notes' %}full{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'billing:list' %}">Cancel</a><button class="btn btn-primary" type="submit">Save usage</button></div></form></section></main></body></html>
