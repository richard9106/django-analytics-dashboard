{% if form.errors %}<div class="form-error" role="alert" tabindex="-1"><strong>Please review the fields below.</strong>{{ form.non_field_errors }}</div>{% endif %}
<div class="field-grid two">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div>
<p>The form appears in the client's portal. The client needs portal access to complete it.</p>
